services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./nuxt-oidc-test-realm.json:/opt/keycloak/data/import/nuxt-oidc-test-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /bin/bash -c "exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          grep -q '200 OK' <&3"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

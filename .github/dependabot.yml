version: 2
updates:
  # Keep the cooldown above pnpm's minimumReleaseAge, or CI's frozen install rejects the bumped versions.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      versions:
        applies-to: version-updates
        patterns:
          - '*'
      security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      versions:
        applies-to: version-updates
        patterns:
          - '*'
      security:
        applies-to: security-updates
        patterns:
          - '*'
